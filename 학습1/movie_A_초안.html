
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>영화 티어리스트</title>
<style>
  body { font-family: sans-serif; background:#1e1e1e; color:#fff; padding:20px; }
  h1 { text-align:center; }

  /* 입력 영역 */
  .input-area { text-align:center; margin:20px 0; }
  .input-area input { padding:8px; margin:4px; border-radius:4px; border:none; }
  .input-area button { padding:8px 16px; margin:4px; cursor:pointer; border:none; border-radius:4px; background:#4caf50; color:#fff; }

  /* 티어 행 */
  .tier-row { display:flex; align-items:stretch; margin-bottom:6px; min-height:90px; }
  .tier-label { width:60px; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:bold; color:#000; }
  .tier-drop { flex:1; display:flex; flex-wrap:wrap; gap:6px; padding:6px; background:#2b2b2b; }

  /* 대기 목록 */
  .pool { display:flex; flex-wrap:wrap; gap:6px; padding:10px; background:#333; margin-top:20px; min-height:90px; }
  .pool-title { margin-top:20px; font-weight:bold; }

  /* 영화 카드 */
  .movie { width:70px; height:100px; background:#555; border-radius:4px; cursor:grab;
           display:flex; align-items:center; justify-content:center; text-align:center;
           font-size:12px; overflow:hidden; position:relative; }
  .movie img { width:100%; height:100%; object-fit:cover; }
  .movie span { padding:2px; }
</style>
</head>
<body>

<h1>🎬 영화 티어리스트</h1>

<!-- 영화 추가 입력 -->
<div class="input-area">
  <input type="text" id="titleInput" placeholder="영화 제목">
  <input type="text" id="posterInput" placeholder="포스터 주소(URL) - 선택">
  <button onclick="addMovie()">추가</button>
  <button onclick="saveData()">저장</button>
  <button onclick="loadData()">불러오기</button>
  <button onclick="resetRanking()" style="background:#e67e22;">초기화</button>
</div>

<!-- 티어 행들 -->
<div id="tierContainer"></div>

<!-- 대기 목록 -->
<div class="pool-title">📥 대기 목록</div>
<div class="pool" id="pool"
     ondragover="event.preventDefault()"
     ondrop="drop(event, this)"></div>

<script>
  const tiers = ["S", "A", "B", "C", "D"];
  const tierColors = {S:"#ff7f7f", A:"#ffbf7f", B:"#ffff7f", C:"#7fff7f", D:"#7fbfff"};

  // 기본 영화 목록 (poster 비어있음 → 제목으로 표시)
  const defaultMovies = [
    {title:"기생충", poster:""},
    {title:"올드보이", poster:""},
    {title:"괴물", poster:""},
    {title:"부산행", poster:""},
    {title:"범죄도시", poster:""}
  ];

  // 티어 행 그리기
  function buildTiers() {
    const c = document.getElementById("tierContainer");
    c.innerHTML = "";
    tiers.forEach(t => {
      const row = document.createElement("div");
      row.className = "tier-row";
      row.innerHTML = `
        <div class="tier-label" style="background:${tierColors[t]}">${t}</div>
        <div class="tier-drop" ondragover="event.preventDefault()"
             ondrop="drop(event, this)"></div>`;
      c.appendChild(row);
    });
  }

  // 영화 카드 만들기
  function createCard(movie) {
    const div = document.createElement("div");
    div.className = "movie";
    div.draggable = true;
    div.dataset.title = movie.title;
    div.dataset.poster = movie.poster || "";
    // 포스터 주소가 있으면 이미지, 없으면 제목 글자
    if (movie.poster) {
      div.innerHTML = `<img src="${movie.poster}" alt="${movie.title}"
        onerror="this.replaceWith(makeTextSpan('${movie.title}'))">`;
    } else {
      div.innerHTML = `<span>${movie.title}</span>`;
    }
    div.addEventListener("dragstart", e => {
      dragged = div;
    });
    return div;
  }

  // 이미지 로드 실패 시 제목 글자로 대체
  function makeTextSpan(title) {
    const s = document.createElement("span");
    s.textContent = title;
    return s;
  }

  // 영화 추가 (대기 목록으로)
  function addMovie() {
    const title = document.getElementById("titleInput").value.trim();
    const poster = document.getElementById("posterInput").value.trim();
    if (!title) { alert("제목을 입력해주세요!"); return; }
    document.getElementById("pool").appendChild(createCard({title, poster}));
    document.getElementById("titleInput").value = "";
    document.getElementById("posterInput").value = "";
  }

  // 드래그 앤 드롭
  let dragged = null;
  function drop(e, zone) {
    e.preventDefault();
    if (dragged) zone.appendChild(dragged);
  }

  // 저장
  function saveData() {
    const data = {tiers:{}, pool:[]};
    document.querySelectorAll(".tier-row").forEach((row, i) => {
      const t = tiers[i];
      data.tiers[t] = [];
      row.querySelector(".tier-drop").querySelectorAll(".movie").forEach(m => {
        data.tiers[t].push({title:m.dataset.title, poster:m.dataset.poster});
      });
    });
    document.getElementById("pool").querySelectorAll(".movie").forEach(m => {
      data.pool.push({title:m.dataset.title, poster:m.dataset.poster});
    });
    localStorage.setItem("movieTierList", JSON.stringify(data));
    alert("저장되었습니다! 💾");
  }

  // 불러오기
  function loadData() {
    const saved = localStorage.getItem("movieTierList");
    if (!saved) { alert("저장된 데이터가 없어요."); return; }
    const data = JSON.parse(saved);
    buildTiers();
    const rows = document.querySelectorAll(".tier-row");
    tiers.forEach((t, i) => {
      const drop = rows[i].querySelector(".tier-drop");
      (data.tiers[t] || []).forEach(m => drop.appendChild(createCard(m)));
    });
    const pool = document.getElementById("pool");
    pool.innerHTML = "";
    (data.pool || []).forEach(m => pool.appendChild(createCard(m)));
    alert("불러왔습니다! 📂");
  }

  // 초기화: 순위만 비우고, 모든 영화를 대기 목록으로 모으기
  function resetRanking() {
    if (!confirm("순위를 초기화할까요?\n(추가한 영화는 대기 목록에 그대로 남아요)")) return;

    // 현재 화면에 있는 모든 영화 수집 (티어 + 대기 목록)
    const allMovies = [];
    document.querySelectorAll(".movie").forEach(m => {
      allMovies.push({title:m.dataset.title, poster:m.dataset.poster});
    });

    // 티어 다시 그리기(비어있는 상태)
    buildTiers();

    // 모든 영화를 대기 목록으로
    const pool = document.getElementById("pool");
    pool.innerHTML = "";
    allMovies.forEach(m => pool.appendChild(createCard(m)));
  }

  // 페이지 시작
  buildTiers();
  defaultMovies.forEach(m => document.getElementById("pool").appendChild(createCard(m)));
</script>
</body>
</html>
