<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎾 테니스 중계 알림 대시보드</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">
    <style>
        /* 기본 스타일 및 레이아웃 */
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; display: flex; height: 100vh; background-color: #f8f9fa; color: #333; }
        
        /* 좌측 사이드바 */
        .sidebar { width: 320px; background-color: #2c3e50; color: white; padding: 25px; box-sizing: border-box; overflow-y: auto; }
        .sidebar h2 { font-size: 1.3rem; border-bottom: 1px solid #455a64; padding-bottom: 15px; margin-top: 0; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.9rem; margin-bottom: 8px; color: #ecf0f1; }
        .form-group input[type="text"], .form-group input[type="email"] { width: 100%; padding: 10px; border: none; border-radius: 5px; box-sizing: border-box; font-size: 0.9rem; }
        
        /* 알림 수단 라디오 버튼 */
        .notify-method { display: flex; gap: 10px; }
        .notify-method label { flex: 1; text-align: center; padding: 10px; background-color: #34495e; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .notify-method input { display: none; }
        .notify-method input:checked + span { font-weight: bold; color: #2ecc71; }
        .notify-method label:hover { background-color: #3d566e; }
        
        /* 체크박스 스타일 */
        .checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 10px; }
        .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }
        
        /* 저장 버튼 */
        .btn-save { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1rem; margin-top: 20px; transition: 0.2s; }
        .btn-save:hover { background-color: #219150; }

        /* 우측 메인 영역 */
        .main-content { flex-grow: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; }
        .header h1 { margin-top: 0; color: #2c3e50; font-size: 1.8rem; margin-bottom: 25px; }
        .week-range { color: #7f8c8d; font-size: 1.2rem; font-weight: normal; margin-left: 10px; }
        
        /* 상단 요약 카드 */
        .summary-box { display: flex; gap: 20px; margin-bottom: 30px; }
        .summary-card { flex: 1; background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #3498db; }
        .summary-card .num { font-size: 2rem; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .summary-card .label { font-size: 0.9rem; color: #7f8c8d; }

        /* 중단 데이터 표 (스크롤 및 고정 헤더 적용) */
        .table-container { 
            background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            margin-bottom: 30px; 
            max-height: 450px; /* 스크롤이 생기는 최대 높이 */
            overflow-y: auto;  /* 세로 스크롤 활성화 */
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid #eee; }
        
        /* 헤더 고정 및 정렬 스타일 */
        th { 
            background-color: #f1f2f6; font-weight: bold; color: #2f3542; font-size: 0.95rem; 
            position: sticky; top: 0; z-index: 1; /* 스크롤 시 상단 고정 */
            box-shadow: 0 2px 2px -1px rgba(0,0,0,0.1);
        }
        th.sortable { cursor: pointer; transition: background-color 0.2s; }
        th.sortable:hover { background-color: #e2e4e9; }
        .sort-icon { font-size: 0.8rem; margin-left: 5px; color: #7f8c8d; }

        tr:hover { background-color: #f8f9fa; }
        
        /* 플랫폼 뱃지 및 태그 */
        .badge { padding: 5px 10px; border-radius: 15px; color: white; font-size: 0.8rem; font-weight: bold; display: inline-block; }
        .badge-spotv { background-color: #004b87; }
        .badge-tvn { background-color: #e74c3c; }
        .badge-tving { background-color: #ff1493; }
        .badge-coupang { background-color: #4b0082; }
        .badge-default { background-color: #95a5a6; }
        
        .time-badge { background-color: #e67e22; color: white; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; margin-left: 8px; font-weight: bold; }
        .star { color: #f1c40f; font-weight: bold; margin-right: 3px; }
        
        a.link-btn { color: #3498db; text-decoration: none; font-weight: bold; padding: 5px 10px; border: 1px solid #3498db; border-radius: 5px; transition: 0.2s; cursor: pointer; }
        a.link-btn:hover { background-color: #3498db; color: white; }

        /* 하단 테스트 버튼 영역 및 가이드 박스 */
        .test-section { margin-top: auto; padding-top: 20px; border-top: 1px dashed #ccc; display: flex; justify-content: space-between; align-items: flex-end; }
        .guide-box { padding: 15px; border-radius: 5px; font-size: 0.9rem; color: #2c3e50; max-width: 60%; line-height: 1.5; transition: 0.3s; }
        .guide-box strong { color: #2980b9; }
        .btn-test { padding: 12px 25px; background-color: #8e44ad; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; height: fit-content; }
        .btn-test:hover { background-color: #732d91; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>⚙️ 알림 설정</h2>
        
        <div class="form-group">
            <label>🔔 알림 수단</label>
            <div class="notify-method">
                <label><input type="radio" name="method" value="email" checked><span>📧 이메일</span></label>
                <label><input type="radio" name="method" value="slack"><span>💬 슬랙</span></label>
            </div>
        </div>
        
        <div class="form-group">
            <label for="email">📧 이메일 주소</label>
            <input type="email" id="email" placeholder="example@email.com">
        </div>
        
        <div class="form-group">
            <label for="slack">💬 슬랙 웹훅 URL</label>
            <input type="text" id="slack" placeholder="https://hooks.slack.com/...">
        </div>
        
        <div class="form-group">
            <label for="player">🎾 관심 선수 (쉼표로 구분)</label>
            <input type="text" id="player" placeholder="예: 알카라스, 조코비치">
        </div>
        
        <label class="checkbox-group">
            <input type="checkbox" id="quarterfinal"> 
            <span>🏆 8강 이상 경기만 알림</span>
        </label>
        
        <button class="btn-save" onclick="saveSettings()">설정 저장하기</button>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1>이번 주 테니스 중계 일정 📺 <span id="week-range" class="week-range"></span></h1>
        </div>
        
        <div class="summary-box" id="summary-box"></div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>일시</th>
                        <!-- 💡 정렬 가능한 헤더에 onclick 이벤트 추가 -->
                        <th class="sortable" onclick="sortTable('tournament')">대회명 <span id="icon-tournament" class="sort-icon">↕️</span></th>
                        <th class="sortable" onclick="sortTable('round')">라운드 <span id="icon-round" class="sort-icon">↕️</span></th>
                        <th>경기 내용</th>
                        <th class="sortable" onclick="sortTable('channel')">중계 채널 <span id="icon-channel" class="sort-icon">↕️</span></th>
                        <th>링크</th>
                    </tr>
                </thead>
                <tbody id="match-table-body"></tbody>
            </table>
        </div>

        <div class="test-section">
            <div class="guide-box" id="guide-box"></div>
            <button class="btn-test" onclick="testNotification()">🚀 알림 발송 테스트</button>
        </div>
    </main>

    <script>
        // 10개의 가상 경기 데이터
        let mockMatches = [
            { date: "오늘 14:00", tournament: "ATP 파이널스", round: "8강", match: "카를로스 알카라스 vs 다닐 메드베데프", channel: "SPOTV", isToday: true, startsInOneHour: true },
            { date: "오늘 20:00", tournament: "ATP 파이널스", round: "8강", match: "노박 조코비치 vs 얀닉 시너", channel: "tvN SPORTS", isToday: true, startsInOneHour: false },
            { date: "오늘 22:00", tournament: "WTA 파이널스", round: "16강", match: "이가 시비옹테크 vs 코코 가우프", channel: "TVING", isToday: true, startsInOneHour: false },
            { date: "내일 16:00", tournament: "WTA 파이널스", round: "8강", match: "아리나 사발렌카 vs 엘레나 리바키나", channel: "TVING", isToday: false, startsInOneHour: false },
            { date: "내일 22:00", tournament: "데이비스 컵", round: "16강", match: "이탈리아 vs 네덜란드", channel: "쿠팡플레이", isToday: false, startsInOneHour: false },
            { date: "모레 14:00", tournament: "ATP 파이널스", round: "4강", match: "미정 vs 미정", channel: "SPOTV", isToday: false, startsInOneHour: false },
            { date: "모레 18:00", tournament: "윔블던", round: "결승", match: "카를로스 알카라스 vs 노박 조코비치", channel: "SPOTV", isToday: false, startsInOneHour: false },
            { date: "3일 뒤 15:00", tournament: "US 오픈", round: "4강", match: "벤 셸튼 vs 프랜시스 티아포", channel: "tvN SPORTS", isToday: false, startsInOneHour: false },
            { date: "4일 뒤 19:00", tournament: "롤랑가로스", round: "8강", match: "라파엘 나달 vs 알렉산더 즈베레프", channel: "tvN SPORTS", isToday: false, startsInOneHour: false },
            { date: "5일 뒤 21:00", tournament: "호주 오픈", round: "결승", match: "얀닉 시너 vs 다닐 메드베데프", channel: "쿠팡플레이", isToday: false, startsInOneHour: false }
        ];

        // 💡 정렬 상태 관리 변수
        let currentSort = { key: null, direction: 'asc' };

        document.addEventListener('DOMContentLoaded', () => {
            setWeekRange();
            loadSettings();
            renderSummary();
            renderTable();
            updateGuideMessage();

            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', updateGuideMessage);
                input.addEventListener('change', updateGuideMessage);
            });
        });

        // 💡 테이블 정렬 함수
        function sortTable(key) {
            // 클릭한 컬럼이 이전과 같으면 방향 반전, 다르면 오름차순(asc)으로 초기화
            if (currentSort.key === key) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.key = key;
                currentSort.direction = 'asc';
            }

            // 라운드 정렬을 위한 가중치 (결승이 가장 높음)
            const roundWeight = { "결승": 4, "4강": 3, "8강": 2, "16강": 1 };

            mockMatches.sort((a, b) => {
                let valA = a[key];
                let valB = b[key];

                // 라운드일 경우 가중치 숫자로 변환하여 비교
                if (key === 'round') {
                    valA = roundWeight[valA] || 0;
                    valB = roundWeight[valB] || 0;
                }

                if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });

            updateSortIcons();
            renderTable();
        }

        // 💡 정렬 아이콘(화살표) 업데이트 함수
        function updateSortIcons() {
            const keys = ['tournament', 'round', 'channel'];
            keys.forEach(k => {
                const iconElement = document.getElementById(`icon-${k}`);
                if (currentSort.key === k) {
                    iconElement.innerText = currentSort.direction === 'asc' ? '⬆️' : '⬇️';
                } else {
                    iconElement.innerText = '↕️';
                }
            });
        }

        function setWeekRange() {
            const today = new Date();
            const nextWeek = new Date(today);
            nextWeek.setDate(today.getDate() + 6);

            const format = (date) => `${date.getMonth() + 1}.${date.getDate()}`;
            document.getElementById('week-range').innerText = `(${format(today)} ~ ${format(nextWeek)})`;
        }

        function renderSummary() {
            const totalMatches = mockMatches.length;
            const tournaments = new Set(mockMatches.map(m => m.tournament)).size;
            const channels = new Set(mockMatches.map(m => m.channel)).size;
            document.getElementById('summary-box').innerHTML = `
                <div class="summary-card"><div class="num">${totalMatches}</div><div class="label">예정된 경기</div></div>
                <div class="summary-card"><div class="num">${tournaments}</div><div class="label">진행 대회</div></div>
                <div class="summary-card"><div class="num">${channels}</div><div class="label">중계 채널</div></div>
            `;
        }

        function renderTable() {
            const tbody = document.getElementById('match-table-body');
            tbody.innerHTML = '';
            mockMatches.forEach(match => {
                let badgeClass = 'badge-default';
                if (match.channel.includes('SPOTV')) badgeClass = 'badge-spotv';
                else if (match.channel.includes('tvN')) badgeClass = 'badge-tvn';
                else if (match.channel.includes('TVING')) badgeClass = 'badge-tving';
                else if (match.channel.includes('쿠팡')) badgeClass = 'badge-coupang';

                const roundMark = (match.round === '결승' || match.round === '4강') ? `<span class="star">★</span> ${match.round}` : match.round;
                const timeMark = match.startsInOneHour ? `<span class="time-badge">1시간 전</span>` : '';

                tbody.innerHTML += `
                    <tr>
                        <td>${match.date} ${timeMark}</td>
                        <td>${match.tournament}</td>
                        <td>${roundMark}</td>
                        <td>${match.match}</td>
                        <td><span class="badge ${badgeClass}">${match.channel}</span></td>
                        <td><a href="javascript:void(0)" class="link-btn" onclick="alert('${match.channel} 중계 화면으로 이동합니다.')">보러가기</a></td>
                    </tr>
                `;
            });
        }

        function saveSettings() {
            const settings = {
                method: document.querySelector('input[name="method"]:checked').value,
                email: document.getElementById('email').value.trim(),
                slack: document.getElementById('slack').value.trim(),
                player: document.getElementById('player').value.trim(),
                quarterfinal: document.getElementById('quarterfinal').checked
            };
            localStorage.setItem('tennisSettings', JSON.stringify(settings));
            alert('✅ 설정이 브라우저에 안전하게 저장되었습니다!');
        }

        function loadSettings() {
            const saved = localStorage.getItem('tennisSettings');
            if (saved) {
                const s = JSON.parse(saved);
                if (s.method) document.querySelector(`input[name="method"][value="${s.method}"]`).checked = true;
                document.getElementById('email').value = s.email || '';
                document.getElementById('slack').value = s.slack || '';
                document.getElementById('player').value = s.player || '';
                document.getElementById('quarterfinal').checked = s.quarterfinal || false;
            }
        }

        function updateGuideMessage() {
            const method = document.querySelector('input[name="method"]:checked').value;
            const player = document.getElementById('player').value.trim();
            const quarterfinal = document.getElementById('quarterfinal').checked;
            const guideBox = document.getElementById('guide-box');
            
            let guideHtml = `현재 <strong>${method === 'email' ? '📧 이메일' : '💬 슬랙'}</strong>로 알림이 설정되어 있습니다.<br>`;
            
            if (!player && !quarterfinal) {
                guideBox.style.backgroundColor = '#fdf0ed';
                guideBox.style.borderLeft = '4px solid #e74c3c';
                guideHtml += `<span style="color: #c0392b;">⚠️ 설정된 알림 조건(관심 선수, 8강 등)이 없어 <strong>아무런 알림도 발송되지 않습니다.</strong></span>`;
            } else {
                guideBox.style.backgroundColor = '#e8f4f8';
                guideBox.style.borderLeft = '4px solid #3498db';
                
                let conditions = [];
                if (player) conditions.push(`관심 선수(<strong>${player}</strong>) 포함`);
                if (quarterfinal) conditions.push(`<strong>8강 이상</strong>`);
                
                const timeCondition = method === 'email' ? '<strong>오늘 하루</strong>' : '<strong>시작 1시간 전</strong>';
                guideHtml += `필터 조건: ${conditions.join(' + ')}인 경기 중 ${timeCondition} 일정이 발송됩니다.`;
            }

            guideBox.innerHTML = guideHtml;
        }

        function testNotification() {
            const method = document.querySelector('input[name="method"]:checked').value;
            const emailValue = document.getElementById('email').value.trim();
            const slackValue = document.getElementById('slack').value.trim();
            const playerValue = document.getElementById('player').value.trim();
            const isQuarterfinal = document.getElementById('quarterfinal').checked;

            if (method === 'email' && !emailValue) { alert('❌ 이메일 주소를 입력해주세요.'); return; }
            if (method === 'slack' && !slackValue) { alert('❌ 슬랙 웹훅 URL을 입력해주세요.'); return; }

            if (!playerValue && !isQuarterfinal) {
                alert('⚠️ 설정된 알림 조건(관심 선수 또는 8강 이상)이 없습니다.\n조건이 없을 경우 전체 일정을 보내지 않고 발송을 생략합니다.\n\n좌측 사이드바에서 조건을 설정해주세요.');
                return;
            }

            let filteredMatches = [...mockMatches];

            if (playerValue) {
                const players = playerValue.split(',').map(p => p.trim());
                filteredMatches = filteredMatches.filter(m => players.some(p => m.match.includes(p)));
            }

            if (isQuarterfinal) {
                const targetRounds = ['8강', '4강', '결승'];
                filteredMatches = filteredMatches.filter(m => targetRounds.includes(m.round));
            }

            if (method === 'email') {
                filteredMatches = filteredMatches.filter(m => m.isToday);
            } else if (method === 'slack') {
                filteredMatches = filteredMatches.filter(m => m.startsInOneHour);
            }

            const targetAddress = method === 'email' ? emailValue : slackValue;
            const timeCriteria = method === 'email' ? '오늘 하루 일정' : '시작 1시간 전 일정';
            
            let alertMsg = `${method === 'email' ? '📧 [이메일' : '💬 [슬랙'} 발송 시뮬레이션]\n수신처: ${targetAddress}\n발송 기준: ${timeCriteria}\n\n`;

            if (filteredMatches.length > 0) {
                alertMsg += `✅ 발송될 경기 목록 (${filteredMatches.length}건):\n`;
                filteredMatches.forEach(m => { alertMsg += `- [${m.date}] ${m.tournament} ${m.round}: ${m.match}\n`; });
            } else {
                alertMsg += `⚠️ 현재 설정하신 조건에 일치하는 [${timeCriteria}] 경기가 없어 알림이 발송되지 않습니다.`;
            }

            alert(alertMsg);
        }
    </script>
</body>
</html>
