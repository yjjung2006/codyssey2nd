<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 영화 티어리스트</title>
  <style>
    /* 디자인 테마 */
    :root { --paper:#faf8f3; --ink:#242922; --muted:#5f685d; --line:#d9dad1; --green:#276453; --sage:#e3eee7; --peach:#f2e6dc; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:system-ui,-apple-system,sans-serif; line-height:1.6; }
    
    main { width:min(100% - 32px, 860px); margin:32px auto 48px; }
    header { margin-bottom: 20px; }
    h1 { margin:0; font-size:clamp(26px, 5vw, 34px); letter-spacing:-.03em; }
    .sub { margin:8px 0 0; color:var(--muted); font-size: 15px; }

    /* 입력 도구 */
    .tools { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; }
    .tools input { min-width:0; flex:1 1 160px; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font:inherit; }
    .tools button { padding:10px 18px; border-radius:12px; font-weight:700; cursor:pointer; border:none; }
    .add-btn { background:var(--green); color:#fff; }
    .reset-btn { background:#fff; color:var(--muted); border:1.5px solid var(--line) !important; }

    #message { min-height:24px; margin:14px 0; font-size:14px; color:var(--green); font-weight:600; }

    /* 티어 리스트 */
    .tiers { display:grid; gap:10px; }
    .row { display:flex; min-height:100px; background:#fff; border:1.5px solid var(--line); border-radius:14px; overflow:hidden; }
    .row.over { outline:3px solid var(--green); outline-offset:1px; }
    
    .label { width:64px; flex-shrink:0; color:white; font-size:26px; font-weight:800; display:flex; align-items:center; justify-content:center; cursor:pointer; border:none; }
    .S .label { background:#a55239; } .A .label { background:#b4763e; } .B .label { background:#276453; } .C .label { background:#67725d; }
    
    .drop { flex:1; min-width:0; display:flex; flex-wrap:wrap; align-content:flex-start; gap:9px; padding:12px; }

    /* 미분류 구역 */
    .pool { margin-top:22px; }
    .pool-head { margin:0 0 8px; color:var(--muted); font-size:17px; font-weight:700; background:none; border:none; cursor:pointer; padding:0; }
    #pool { border:1.5px dashed var(--line); border-radius:14px; background:#fff; min-height:110px; }

    /* 영화 카드: 센터링 수정 */
    .card { 
      width:100px; 
      height:70px; /* 고정 높이 부여 */
      padding:8px; 
      border-radius:10px; 
      font-size:14px; 
      font-weight:650; 
      line-height:1.2; 
      cursor:grab; 
      border:1px solid rgba(0,0,0,0.05); 
      
      /* [수정] 박스 안 제목 중앙 정렬 */
      display: flex;
      align-items: center;    /* 세로 중앙 */
      justify-content: center; /* 가로 중앙 */
      text-align: center;     /* 텍스트 정렬 */
      overflow-wrap: anywhere;
    }
    .card[aria-pressed="true"] { outline:3px solid var(--green); outline-offset:2px; z-index:1; }
    
    .note { font-size:13px; color:var(--muted); margin-top:20px; }

    @media(max-width:420px) {
      .label { width:50px; font-size:20px; }
      .card { width:calc(50% - 5px); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>내 영화 티어리스트</h1>
      <p class="sub">카드를 클릭하고 등급(S·A·B·C)을 누르거나, 카드를 직접 끌어서 놓으세요.</p>
    </header>

    <form class="tools" id="add-form">
      <input id="title-input" placeholder="영화 제목 추가" maxlength="50">
      <button type="submit" class="add-btn">추가</button>
      <button type="button" class="reset-btn" id="reset-btn">처음으로</button>
    </form>

    <p id="message" role="status">영화 카드를 선택해 보세요!</p>

    <section class="tiers" id="tiers-container"></section>

    <section class="pool">
      <button class="pool-head" id="pool-label" type="button">아직 안 정한 영화 (클릭 시 복귀)</button>
      <div class="drop" id="pool" data-tier="pool"></div>
    </section>

    <p class="note">※ 브라우저를 닫아도 목록이 유지됩니다. '처음으로'를 누르면 초기 상태로 돌아갑니다.</p>
  </main>

  <script>
    // 로컬스토리지 키값
    const STORAGE_KEY = "my-movie-tier-v2";
    const TIERS = ['S', 'A', 'B', 'C'];
    const INITIAL_TITLES = ["기생충", "인터스텔라", "라라랜드", "센과 치히로의 행방불명", "어벤져스: 엔드게임", "범죄도시", "타이타닉", "토이 스토리"];
    const COLORS = ["#f2e6dc", "#e3eee7", "#ede7f6", "#fcefd9", "#e2ecf4", "#f6e3e3"];

    // 초기 데이터 구조
    const getInitialState = () => ({
      nextId: INITIAL_TITLES.length + 1,
      movies: INITIAL_TITLES.map((title, i) => ({ id: 'm' + (i + 1), title, tier: 'pool' }))
    });

    let state = getInitialState();
    let selectedId = null;

    // [저장 기능] 로컬 스토리지에서 데이터 불러오기
    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          state = JSON.parse(saved);
        } catch (e) {
          state = getInitialState();
        }
      }
    }

    // [저장 기능] 로컬 스토리지에 데이터 저장하기
    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function showMsg(txt) { document.getElementById('message').textContent = txt; }

    // 영화 이동 처리
    function moveMovie(id, targetTier) {
      const movie = state.movies.find(m => m.id === id);
      if (movie) {
        movie.tier = targetTier;
        selectedId = null;
        saveData(); // 상태 변경 시 저장
        render();
        showMsg(`'${movie.title}' 이동 완료!`);
      }
    }

    // 카드 생성
    function createCard(movie, index) {
      const card = document.createElement('button');
      card.className = 'card';
      card.textContent = movie.title;
      card.style.backgroundColor = COLORS[index % COLORS.length];
      card.draggable = true;
      card.setAttribute('aria-pressed', selectedId === movie.id);

      card.onclick = (e) => {
        e.stopPropagation();
        selectedId = (selectedId === movie.id) ? null : movie.id;
        render();
        showMsg(selectedId ? `'${movie.title}' 선택됨. 등급을 눌러보세요.` : "선택 해제");
      };

      card.ondragstart = (e) => {
        e.dataTransfer.setData('text/plain', movie.id);
        selectedId = movie.id;
      };

      return card;
    }

    // 드롭 영역 설정
    function setupDropZone(el, tier) {
      el.ondragover = (e) => { e.preventDefault(); el.closest('.row')?.classList.add('over'); };
      el.ondragleave = () => { el.closest('.row')?.classList.remove('over'); };
      el.ondrop = (e) => {
        e.preventDefault();
        el.closest('.row')?.classList.remove('over');
        const id = e.dataTransfer.getData('text/plain');
        moveMovie(id, tier);
      };
      el.onclick = () => { if (selectedId) moveMovie(selectedId, tier); };
    }

    // 화면 렌더링
    function render() {
      const container = document.getElementById('tiers-container');
      container.innerHTML = '';

      TIERS.forEach(tier => {
        const row = document.createElement('div');
        row.className = `row ${tier}`;
        
        const label = document.createElement('button');
        label.className = 'label';
        label.textContent = tier;
        label.onclick = () => { if (selectedId) moveMovie(selectedId, tier); else showMsg("카드를 먼저 선택하세요!"); };

        const dropZone = document.createElement('div');
        dropZone.className = 'drop';
        state.movies.filter(m => m.tier === tier).forEach((m, idx) => {
          dropZone.appendChild(createCard(m, idx));
        });

        setupDropZone(dropZone, tier);
        row.append(label, dropZone);
        container.appendChild(row);
      });

      const poolZone = document.getElementById('pool');
      poolZone.innerHTML = '';
      state.movies.filter(m => m.tier === 'pool').forEach((m, idx) => {
        poolZone.appendChild(createCard(m, idx));
      });
      setupDropZone(poolZone, 'pool');
    }

    // 영화 추가
    document.getElementById('add-form').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('title-input');
      const title = input.value.trim();
      if (!title) return showMsg("영화 제목을 입력해주세요!");
      
      state.movies.push({ id: 'm' + state.nextId++, title, tier: 'pool' });
      input.value = '';
      saveData(); // 추가 시 저장
      render();
      showMsg("새 영화가 추가되었습니다.");
    };

    // 초기화 버튼
    document.getElementById('reset-btn').onclick = () => {
      if (confirm("모든 배치를 초기화하고 처음 목록으로 돌아갈까요?")) {
        state = getInitialState();
        selectedId = null;
        saveData(); // 초기화 시 저장
        render();
        showMsg("초기화되었습니다.");
      }
    };

    // 미분류 라벨 클릭 시 이동
    document.getElementById('pool-label').onclick = () => {
      if (selectedId) moveMovie(selectedId, 'pool');
    };

    // 실행 시작
    loadData();
    render();
  </script>
</body>
</html>
